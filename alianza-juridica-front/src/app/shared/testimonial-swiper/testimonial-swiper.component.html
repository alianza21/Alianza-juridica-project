<!-- testimonial-swiper.component.html -->
<div class="testimonial-wrapper">
  <swiper-container #swiperEl init="false" class="testimonial-swiper">
    <swiper-slide *ngFor="let item of items">
      <article class="testimonial-card">
        <div class="testimonial-top">
          <div class="person">
            <h3>{{ item.name }}</h3>
            <p *ngIf="item.role">{{ item.role }}</p>
          </div>
        </div>

        <div class="stars" *ngIf="item.rating">
          <span *ngFor="let star of [1,2,3,4,5]">
            {{ star <= (item.rating || 0) ? '★' : '☆' }}
          </span>
        </div>

        <p class="message">{{ item.message }}</p>
      </article>
    </swiper-slide>
  </swiper-container>

  <!-- Controles externos: prev - paginación - next -->
  <div class="testimonial-controls">
    <button #prevEl type="button" class="nav-btn prev" aria-label="Anterior">
      <svg class="swiper-navigation-icon swiper-navigation-icon-prev" width="11" height="20" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0.38296 20.0762C0.111788 19.805 0.111788 19.3654 0.38296 19.0942L9.19758 10.2796L0.38296 1.46497C0.111788 1.19379 0.111788 0.754138 0.38296 0.482966C0.654131 0.211794 1.09379 0.211794 1.36496 0.482966L10.4341 9.55214C10.8359 9.9539 10.8359 10.6053 10.4341 11.007L1.36496 20.0762C1.09379 20.3474 0.654131 20.3474 0.38296 20.0762Z" fill="currentColor">
        </path>
      </svg>
    </button>

    <div #paginationEl class="testimonial-pagination"></div>

    <button #nextEl type="button" class="nav-btn next" aria-label="Siguiente">
      <svg class="swiper-navigation-icon" width="11" height="20" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0.38296 20.0762C0.111788 19.805 0.111788 19.3654 0.38296 19.0942L9.19758 10.2796L0.38296 1.46497C0.111788 1.19379 0.111788 0.754138 0.38296 0.482966C0.654131 0.211794 1.09379 0.211794 1.36496 0.482966L10.4341 9.55214C10.8359 9.9539 10.8359 10.6053 10.4341 11.007L1.36496 20.0762C1.09379 20.3474 0.654131 20.3474 0.38296 20.0762Z" fill="currentColor">
        </path>
      </svg>
    </button>
  </div>
</div>
