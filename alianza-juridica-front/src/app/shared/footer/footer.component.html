<!-- src/app/shared/components/footer/footer.component.html -->
<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <!-- Línea con copyright -->
    <div class="copyright-line">
      © Dr. Andrés Soto Argel
    </div>

    <hr class="footer-separator" />

    <div class="footer-grid" role="navigation" aria-label="Enlaces legales y contacto">
      <div class="footer-main">
        <h2 class="footer-title">Legal</h2>

        <p class="footer-link">
          <a routerLink="/privacy-policy" routerLinkActive="active" class="link">Política de tratamiento de datos personales</a>
        </p>

        <p class="footer-link">
          <a routerLink="/data-authorization" routerLinkActive="active" class="link">Autorización tratamiento de datos</a>
        </p>
      </div>

      <div class="footer-bottom">
        <h2 class="footer-title">Contacto</h2>
        <p class="footer-item">
          <a [href]="mapsHref" target="_blank" rel="noopener noreferrer" class="link">
             <!-- icono pin (inline SVG) -->
          <svg class="icon icon-pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
          </svg>
            Puerto Berrío. Calle 48 n. 6 - 40, Barrio El Hoyo.
          </a>
        </p>

        <p class="footer-item">
          <a [href]="whatsappHref" target="_blank" rel="noopener noreferrer" class="link">
            <svg class="icon icon-whatsapp" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.52 3.48A11.94 11.94 0 0 0 12 0C5.37 0 .01 5.36.01 12a11.9 11.9 0 0 0 2.05 6.6L0 24l5.6-1.85A11.94 11.94 0 0 0 12 24c6.63 0 12-5.36 12-12 0-3.2-1.25-6.2-3.48-8.52zM12 21.5c-1.8 0-3.56-.47-5.1-1.36l-.36-.21-3.33 1.1 1.12-3.24-.23-.37A9.5 9.5 0 1 1 21.5 12 9.5 9.5 0 0 1 12 21.5zM17.2 14.1c-.3-.15-1.78-.88-2.06-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.96 1.18-.18.2-.36.22-.66.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.48-1.77-1.65-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.36.45-.54.15-.18.2-.3.3-.5.1-.2 0-.38-.05-.53-.05-.15-.68-1.64-.93-2.25-.24-.59-.48-.51-.66-.52l-.56-.01c-.18 0-.47.07-.72.34-.25.27-.96.94-.96 2.3 0 1.36.99 2.68 1.13 2.86.14.18 1.95 3 4.73 4.2 3.3 1.4 3.3 0 3.9-.9.6-.9.6-1.66.42-1.83-.18-.17-.66-.27-.96-.42z"/>
          </svg> 
            302-779-6666
          </a>
        </p>

        <p class="footer-item">
          <a [href]="mailtoHref" class="link">
             <svg class="icon icon-mail" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/>
              </svg>
            {{ email }}
          </a>
        </p>
      </div>
    </div>
  </div>
</footer>
